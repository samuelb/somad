name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "demo.gif"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the site
        run: make site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - id: deployment
        uses: actions/deploy-pages@v5

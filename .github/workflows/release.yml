name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto derives it from conventional commits)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: "Build and render release artifacts without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- Prepare
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cliff.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags: git-cliff derives the next version from
          # conventional commits since the last tag.
          fetch-depth: 0

      - name: Compute next version and release notes
        id: cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: --bump=${{ inputs.bump }} --unreleased
        env:
          OUTPUT: release-notes.md

      - name: Validate computed tag
        env:
          TAG: ${{ steps.cliff.outputs.version }}
        run: |
          echo "Next version: $TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::git-cliff computed '$TAG', expected vX.Y.Z"; exit 1
          fi

      - name: Check tag doesn't exist
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.cliff.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' already exists — nothing releasable since the last release?"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Run tests
        run: go test -v -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      # Keep the version recorded in flake.nix in sync with the release. On a
      # dry run the bump is rendered and discarded; on a real run it is
      # committed to the branch and the release is cut from that commit.
      - name: Bump version
        id: bump
        env:
          VERSION: ${{ steps.cliff.outputs.version }}
        run: |
          scripts/bump-version.sh "${VERSION#v}"
          if git diff --quiet; then
            echo "Version metadata already at ${VERSION#v}; nothing to bump."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: discarding the version bump."
            git checkout -- .
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Linux
  build:
    name: Linux ${{ matrix.goarch }}
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        # The tag points at the bump commit prepare pushed, not at the
        # workflow-trigger commit in GITHUB_SHA, so stamp that one.
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${RELEASE_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o soma_${{ matrix.goos }}_${{ matrix.goarch }} ./cmd/soma

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soma-${{ matrix.goos }}-${{ matrix.goarch }}
          path: soma_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS (universal)
  build-darwin:
    name: macOS (universal)
    needs: prepare
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      # Signing and notarization run only when the Developer ID secrets are
      # configured (ADR-0029); without them the job ships an unsigned build
      # exactly as before. `secrets` is not usable in a job-level `if`, so
      # the presence check is materialized here.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build universal binary
        # CGO is required on macOS for the menu-bar tray (Cocoa). The runner is
        # Apple Silicon, so the amd64 slice is a cgo cross-compile via clang's
        # -arch; the macOS SDK ships universal libraries so both slices link.
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          LDFLAGS="-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${RELEASE_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOARCH=arm64 CC="clang -arch arm64" go build -ldflags "$LDFLAGS" -o soma_darwin_arm64 ./cmd/soma
          GOARCH=amd64 CC="clang -arch x86_64" go build -ldflags "$LDFLAGS" -o soma_darwin_amd64 ./cmd/soma
          mkdir -p dist
          lipo -create -output dist/soma_darwin_universal soma_darwin_amd64 soma_darwin_arm64
          lipo -info dist/soma_darwin_universal

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain holds the identity for this job only; it is
          # deleted in the cleanup step below even when signing fails.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -A -t cert -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign the binary
        if: env.HAS_SIGNING == 'true'
        # Hardened runtime and a secure timestamp are what notarization
        # requires. The Cocoa tray needs no entitlements.
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp \
            dist/soma_darwin_universal
          codesign --verify --strict --verbose=2 dist/soma_darwin_universal

      - name: Build .dmg
        run: packaging/macos/build-dmg.sh dist/soma_darwin_universal dist

      - name: Notarize and staple the .dmg
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        # Notarizing the image also registers the ticket for the signed binary
        # inside it, so the bare soma_darwin_universal download passes
        # Gatekeeper online too; only the .dmg can carry a stapled ticket.
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp dist/soma-macos.dmg
          xcrun notarytool submit dist/soma-macos.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple dist/soma-macos.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/soma-macos.dmg

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soma-darwin
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Publish
  release:
    name: Publish release
    needs: [prepare, build, build-darwin]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes

      - name: Show release notes
        run: cat release-notes.md

      - name: Create tag
        if: inputs.dry_run == false
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: soma-*
          merge-multiple: true

      - name: Install nfpm
        env:
          NFPM_TOOL_VERSION: "2.43.0"
          # sha256 of nfpm_${NFPM_TOOL_VERSION}_amd64.deb, from that release's
          # published checksums.txt: https://github.com/goreleaser/nfpm/releases/download/v2.43.0/checksums.txt
          NFPM_DEB_SHA256: "4a4402f8f9ea87c669d6a62b333f8e268439974754dd886a01731ecaf9fa6d66"
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_TOOL_VERSION}/nfpm_${NFPM_TOOL_VERSION}_amd64.deb"
          echo "${NFPM_DEB_SHA256}  /tmp/nfpm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          export NFPM_VERSION="${VERSION#v}"
          for arch in amd64 arm64; do
            rpmarch=$([ "$arch" = amd64 ] && echo x86_64 || echo aarch64)
            chmod +x "dist/soma_linux_${arch}"
            NFPM_ARCH="$arch" NFPM_BINARY="dist/soma_linux_${arch}" \
              nfpm package -f packaging/nfpm.yaml -p deb -t "dist/somad_${NFPM_VERSION}_linux_${arch}.deb"
            NFPM_ARCH="$arch" NFPM_BINARY="dist/soma_linux_${arch}" \
              nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/somad-${NFPM_VERSION}-1.${rpmarch}.rpm"
          done

      - name: Stage source archive and Arch PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: scripts/stage-arch-release.sh "${VERSION#v}" dist

      - name: Generate checksums
        run: (cd dist && sha256sum -- * > ../checksums.txt && mv ../checksums.txt .)

      # Only on a real publish: attesting a dry run would create a permanent,
      # publicly verifiable provenance record for artifacts that were never
      # released.
      - name: Attest build provenance
        if: inputs.dry_run == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.dry_run == true
        with:
          name: release-artifacts
          path: |
            dist/*
            release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: inputs.dry_run == false
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          body_path: release-notes.md
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------- Homebrew tap
  homebrew:
    name: Render Homebrew tap files
    needs: [prepare, release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checksums

      - name: Render tap files
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: scripts/stage-homebrew.sh "${VERSION#v}" checksums.txt rendered

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-tap-files
          path: rendered/
          if-no-files-found: error

  publish-homebrew:
    name: Publish Homebrew tap
    needs: [prepare, homebrew]
    if: inputs.dry_run == false
    permissions:
      contents: read
    uses: samuelb/homebrew-tap/.github/workflows/publish.yml@853fd0dde720c3fdd6ffe0f1088a0c03e89ea423 # main
    with:
      artifact_name: homebrew-tap-files
      commit_message: "somad ${{ needs.prepare.outputs.tag }}"
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

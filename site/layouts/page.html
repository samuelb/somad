{{ define "main" }}
<article class="wrap doc">
  <header class="doc-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="doc-body">
    {{ with .TableOfContents }}
    <aside class="toc" aria-label="On this page">
      <p class="toc-title">On this page</p>
      {{ . }}
    </aside>
    {{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}

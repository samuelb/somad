<header class="topbar">
  <nav class="wrap" aria-label="Main">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><use href="{{ "favicon.svg" | relURL }}#mark"/></svg>
      <span>soma<span class="brand-d">d</span></span>
    </a>
    <ul class="menu">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $cur.IsMenuCurrent "main" . }} aria-current="page"{{ end }}{{ if hasPrefix .URL "http" }} rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>

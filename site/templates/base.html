<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ section.title }}</title>
  <meta name="description" content="{{ section.description }}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <link rel="canonical" href="{{ config.base_url }}/">
  <link rel="icon" href="{{ get_url(path="favicon.svg") }}" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:title" content="{{ section.title }}">
  <meta property="og:description" content="{{ section.description }}">
  <meta property="og:url" content="{{ config.base_url }}/">
  <meta property="og:image" content="{{ get_url(path="demo.gif") }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{ get_url(path="fonts/iosevka-800.woff2") }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path="style.css", cachebust=true) }}">
  <script src="{{ get_url(path="site.js", cachebust=true) }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <nav class="wrap tmux" aria-label="Main">
      <a class="brand" href="#top">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><use href="{{ get_url(path="favicon.svg") }}#mark"/></svg>
        <span class="session">soma<span class="brand-d">d</span></span>
      </a>
      <ul class="menu">
        <li><a href="#features" data-key="f" aria-keyshortcuts="f" title="Press f"><span class="idx" aria-hidden="true">f:</span>features<span class="flag" aria-hidden="true"></span></a></li>
        <li><a href="#install" data-key="i" aria-keyshortcuts="i" title="Press i"><span class="idx" aria-hidden="true">i:</span>install<span class="flag" aria-hidden="true"></span></a></li>
        <li><a href="#usage" data-key="u" aria-keyshortcuts="u" title="Press u"><span class="idx" aria-hidden="true">u:</span>usage<span class="flag" aria-hidden="true"></span></a></li>
      </ul>
      <p class="status-right">
        <a href="{{ config.extra.repo }}" rel="noopener">github&nbsp;↗</a>
      </p>
    </nav>
  </header>

  <main id="main">
{% block main %}{% endblock main %}
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="prompt" aria-hidden="true"><span class="cwd">~/somad</span> <span class="ps">$</span> <span class="cursor"></span></p>
      <p class="helpbar">
        <a href="{{ config.extra.repo }}">source</a><span>•</span>
        <a href="{{ config.extra.repo }}/releases">releases</a><span>•</span>
        <a href="{{ config.extra.repo }}/issues">issues</a><span>•</span>
        <a href="{{ config.extra.repo }}/blob/main/LICENSE">mit license</a>
      </p>
      <p class="fine">Somad is not affiliated with SomaFM. All content and station streams are provided by
        <a href="https://somafm.com/">somafm.com</a>. If you enjoy the music,
        <a href="https://somafm.com/support/">support SomaFM</a>.</p>
    </div>
  </footer>

  <script>
    // Show the latest release tag; the link works without it.
    fetch("https://api.github.com/repos/{{ config.extra.github_repo }}/releases/latest")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.tag_name) document.getElementById("version").textContent = d.tag_name; })
      .catch(function () {});
  </script>
</body>
</html>
